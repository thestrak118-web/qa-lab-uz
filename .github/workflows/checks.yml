name: QA Lab checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --test-isolation=none tests/*.test.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
