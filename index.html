<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("qa-lab-theme");
          if (["light", "dark", "system"].includes(saved)) preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#10151d" : "#f7f8fa";
      })();
    </script>
    <meta
      name="description"
      content="QA laboratoriya: realistik demo do‘kon, yashirin xatolar, checklist, test-case va bug-report mashqlari."
    />
    <title>QA Lab — Test workspace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
